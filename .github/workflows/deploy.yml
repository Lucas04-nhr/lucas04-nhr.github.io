name: Check and Deploy

on:
  # 当 push 到 main 分支时触发部署
  push:
    branches: [main]
  # 手动触发部署
  workflow_dispatch:

# Use minimal read for contents and give Pages and id-token write permissions
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-version:
    name: Check template version
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
      needs_update: ${{ steps.check.outputs.needs_update }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check for updates
        id: check
        run: |
          # 获取当前版本
          CURRENT_VERSION=$(jq -r '.devDependencies["vuepress-theme-plume"]' package.json)

          GITHUB_METADATA=$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/pengzhanbo/vuepress-theme-plume/releases/latest || true)
          NPM_METADATA=$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            https://registry.npmjs.org/vuepress-theme-plume/latest || true)

          GITHUB_VERSION=$(jq -r '.tag_name // empty' <<< "$GITHUB_METADATA")
          NPM_VERSION=$(jq -r '.version // empty' <<< "$NPM_METADATA")
          TARGET_VERSION=$(node .github/scripts/latest-semver.mjs "$GITHUB_VERSION" "$NPM_VERSION")
          NEWEST_VERSION=$(node .github/scripts/latest-semver.mjs "$CURRENT_VERSION" "$TARGET_VERSION")

          echo "Latest GitHub version: ${GITHUB_VERSION:-unavailable}"
          echo "Latest npm version: ${NPM_VERSION:-unavailable}"
          echo "Selected target version: ${TARGET_VERSION:-unavailable}"
          echo "Current version: $CURRENT_VERSION"

          if [ -z "$TARGET_VERSION" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Failed to query both release sources; skip dependency update and continue with deployment"
            exit 0
          fi

          # 仅当 GitHub/npm 中较新的版本也比当前版本新时才更新，避免降级
          if [ "$TARGET_VERSION" = "$NEWEST_VERSION" ] && [ "$TARGET_VERSION" != "$CURRENT_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "is_latest=false" >> $GITHUB_OUTPUT
            echo "new_version=$TARGET_VERSION" >> $GITHUB_OUTPUT
            echo "⚠️ Version outdated: $CURRENT_VERSION -> $TARGET_VERSION (will update, skip deployment)"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "is_latest=true" >> $GITHUB_OUTPUT
            echo "✅ Version is up to date (will proceed with deployment)"
          fi

  update-dependencies:
    name: Update template dependencies
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.needs_update == 'true'
    outputs:
      changes_committed: ${{ steps.commit.outputs.changes_committed }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Update dependencies
        id: update
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm dlx vp-update

      - name: Commit and push changes
        id: commit
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          if [ "$INSTALL_OUTCOME" != "success" ] || [ "$UPDATE_OUTCOME" != "success" ]; then
            echo "changes_committed=false" >> "$GITHUB_OUTPUT"
            echo "Dependency update failed; skip commit and continue with Pages build."
            exit 0
          fi

          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          git add package.json pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "changes_committed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes to commit; continue with Pages build."
            exit 0
          fi

          git commit -m "chore(dep): Update template to \`${{ needs.check-version.outputs.new_version }}\`"
          git push
          echo "changes_committed=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build site and upload pages artifact
    runs-on: ubuntu-latest
    needs: [check-version, update-dependencies]
    if: >-
      always() &&
      needs.check-version.result == 'success' &&
      (needs.check-version.outputs.is_latest == 'true' ||
      (needs.update-dependencies.result == 'success' &&
      needs.update-dependencies.outputs.changes_committed == 'false'))
    steps:
      - uses: actions/checkout@v6
        with:
          # 保留全部提交历史以便生成“最近更新时间”等信息
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VuePress site
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          pnpm approve-builds --all
          pnpm run docs:build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # VuePress 默认输出目录
          path: docs/.vuepress/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [check-version, build]
    if: always() && needs.build.result == 'success'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
