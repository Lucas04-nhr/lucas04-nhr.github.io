name: Update Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0" # 每周一 4:00(CST) 运行一次

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Check for updates
        id: check_updates
        run: |
          # 获取当前版本
          CURRENT_VERSION=$(jq -r '.devDependencies["vuepress-theme-plume"]' package.json)

          GITHUB_METADATA=$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/pengzhanbo/vuepress-theme-plume/releases/latest || true)
          NPM_METADATA=$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            https://registry.npmjs.org/vuepress-theme-plume/latest || true)

          GITHUB_VERSION=$(jq -r '.tag_name // empty' <<< "$GITHUB_METADATA")
          NPM_VERSION=$(jq -r '.version // empty' <<< "$NPM_METADATA")
          TARGET_VERSION=$(node .github/scripts/latest-semver.mjs "$GITHUB_VERSION" "$NPM_VERSION")
          NEWEST_VERSION=$(node .github/scripts/latest-semver.mjs "$CURRENT_VERSION" "$TARGET_VERSION")

          echo "Latest GitHub version: ${GITHUB_VERSION:-unavailable}"
          echo "Latest npm version: ${NPM_VERSION:-unavailable}"
          echo "Selected target version: ${TARGET_VERSION:-unavailable}"
          echo "Current version: $CURRENT_VERSION"

          if [ -z "$TARGET_VERSION" ]; then
            echo "NEEDS_UPDATE=false" >> "$GITHUB_ENV"
            echo "⚠️ Failed to query both release sources; skip dependency update and continue with Pages build"
            exit 0
          fi

          # 仅当 GitHub/npm 中较新的版本也比当前版本新时才更新，避免降级
          if [ "$TARGET_VERSION" = "$NEWEST_VERSION" ] && [ "$TARGET_VERSION" != "$CURRENT_VERSION" ]; then
            echo "NEEDS_UPDATE=true" >> $GITHUB_ENV
            echo "NEW_VERSION=$TARGET_VERSION" >> $GITHUB_ENV
            echo "Update needed: $CURRENT_VERSION -> $TARGET_VERSION"
          else
            echo "NEEDS_UPDATE=false" >> $GITHUB_ENV
            echo "Already up to date"
          fi

      - name: Setup pnpm
        if: env.NEEDS_UPDATE == 'true'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        id: install
        if: env.NEEDS_UPDATE == 'true'
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Update dependencies
        id: update
        if: env.NEEDS_UPDATE == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm dlx vp-update

      - name: Commit changes
        if: always() && env.NEEDS_UPDATE == 'true'
        id: commit
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          if [ "$INSTALL_OUTCOME" != "success" ] || [ "$UPDATE_OUTCOME" != "success" ]; then
            echo "changes_committed=false" >> "$GITHUB_OUTPUT"
            echo "Dependency update failed; skip commit and continue with Pages build."
            exit 0
          fi

          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          git add package.json pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "changes_committed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes to commit."
            exit 0
          fi

          git commit -m "chore(dep): Update template to \`${{ env.NEW_VERSION }}\`"
          git push
          echo "changes_committed=true" >> "$GITHUB_OUTPUT"

      - name: Build Pages when no changes were committed
        if: env.NEEDS_UPDATE != 'true' || steps.commit.outputs.changes_committed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
